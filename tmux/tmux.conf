# ---- Browser-style tab bar at the top ----
set -g status-position top
set -g status-justify left
set -g status-interval 5

# Let mouse clicks switch tabs, resize panes, and scroll
set -g mouse on

# Tabs numbered from 1 (like browser Alt+1..9), renumbered when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# True color inside WezTerm
set -g default-terminal "tmux-256color"
set -as terminal-features ",wezterm*:RGB,xterm-256color:RGB"

# Colors: "liquid glass" -- transparent bar so WezTerm's frosted background shows through,
# translucent-looking pill tabs with a soft blue glow for the active one
set -g status-style "bg=default,fg=#8b8fa8"
set -g status-left "#[fg=#7aa2f7]#[bg=#7aa2f7,fg=#1a1d33,bold] #S#[bg=default,fg=#7aa2f7,nobold] "
set -g status-left-length 30
set -g status-right "#[fg=#6b7399]%a %b %d  #[fg=#a9c7ff]%H:%M "

set -g window-status-separator ""
setw -g window-status-format         "#[fg=#8b8fa8]  #I  #W  "
setw -g window-status-current-format "#[fg=#2e3c66]#[bg=#2e3c66,fg=#e6ecff,bold] #I  #W#{?window_zoomed_flag, 󰊓,} #[bg=default,fg=#2e3c66,nobold] "
setw -g window-status-activity-style "fg=#e0af68"

# Keep tab titles as the running program unless you rename them
setw -g automatic-rename on
set -g allow-rename off

set -g pane-border-style "fg=#2f3654"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#2e3c66,fg=#e6ecff"

# ---- Browser-like shortcuts (no prefix needed) ----
bind -n M-t new-window -c "#{pane_current_path}"      # Alt+t  new tab
bind -n M-w confirm-before -p "Close tab #W? (y/n)" kill-window  # Alt+w close tab
bind -n M-] next-window                               # Alt+]  next tab
bind -n M-[ previous-window                           # Alt+[  previous tab
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-< swap-window -t -1 \; previous-window      # Alt+Shift+,  move tab left
bind -n M-> swap-window -t +1 \; next-window          # Alt+Shift+.  move tab right

# New tabs/splits open in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# prefix + r reloads this file
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
